# Builds the VEILUX release packages: the browser extensions and the
# standalone backend for each system, each checked before it is kept.
# Separate from the test workflow (browsers.yml). The packages stay private
# build artifacts of this repository; nothing is published or released here.
# See packaging/PUBLISHING.md for the steps to publish them.
name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['release/**']
    paths:
      - 'extension/**'
      - 'server.py'
      - 'secret_detection.py'
      - 'requirements.txt'
      - 'packaging/**'
      - 'tools/browser-check/**'
      - '.github/workflows/package.yml'

# The build only reads the code.
permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  extensions:
    name: Browser extensions (Chromium ZIP, Firefox XPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the ZIP and the XPI
        run: python3 packaging/build_extensions.py dist
      - name: Check their contents
        run: python3 packaging/check_package.py dist/veilux-*-chromium.zip dist/veilux-*-firefox.xpi
      - name: Check the XPI with Mozilla's add-on linter and the compatibility lint
        run: |
          mkdir -p build/xpi && unzip -q dist/veilux-*-firefox.xpi -d build/xpi
          cd tools/browser-check && npm ci --no-audit --no-fund
          VEILUX_EXTENSION_DIR="$GITHUB_WORKSPACE/build/xpi" npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            dist/*.zip
            dist/*.xpi
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend (${{ matrix.tag }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, tag: windows-x64 }
          # The oldest available Linux runner, so the program runs on glibc 2.35 and later.
          - { os: ubuntu-22.04, tag: linux-x64 }
          - { os: macos-15-intel, tag: macos-x64 }
          - { os: macos-15, tag: macos-arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the backend's libraries and PyInstaller
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build
        run: python packaging/build_backend.py dist
      - name: Check the build is for ${{ matrix.tag }}
        run: ls dist/veilux-backend-*-${{ matrix.tag }}.*
      - name: Check the package's contents and icons
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y -qq desktop-file-utils >/dev/null; fi
          python packaging/check_package.py dist/veilux-backend-*-${{ matrix.tag }}.*
      - name: Start, pair, use, stop and restart the packaged backend
        run: |
          mkdir -p "$RUNNER_TEMP/extracted"
          python -c "import glob, shutil, sys; shutil.unpack_archive(glob.glob('dist/veilux-backend-*-${{ matrix.tag }}.*')[0], sys.argv[1])" "$RUNNER_TEMP/extracted"
          program=$(ls -d "$RUNNER_TEMP"/extracted/veilux-backend-*/veilux-backend*  | grep -v '\.txt$' | head -1)
          cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/packaging/smoke_test.py" "$program"
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.tag }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  pairing:
    name: Built extension pairs with the built backend (Chromium, Linux)
    needs: [extensions, backend]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: '{extensions,backend-linux-x64}'
          merge-multiple: true
          path: packages
      - name: Install Playwright and Chromium
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Pair and use
        run: |
          mkdir -p "$RUNNER_TEMP/backend" && tar -xzf packages/veilux-backend-*-linux-x64.tar.gz -C "$RUNNER_TEMP/backend"
          python packaging/pairing_e2e.py packages/veilux-*-chromium.zip "$RUNNER_TEMP"/backend/veilux-backend-*/veilux-backend

  checksums:
    name: Checksums
    needs: [extensions, backend, pairing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '{extensions,backend-*}'
          merge-multiple: true
          path: release
      - name: SHA-256 of every package
        run: |
          cd release
          sha256sum -- * | tee SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 6
      - uses: actions/upload-artifact@v4
        with:
          name: veilux-release-packages
          path: release/
          if-no-files-found: error
          retention-days: 30

  # Safari needs an Xcode app wrapper. This job converts the extension with
  # Apple's converter and builds it unsigned, to show what Safari packaging
  # needs. It is experimental and does not block the other packages.
  safari:
    name: Safari (experimental, unsigned Xcode project)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Convert with safari-web-extension-converter
        run: |
          mkdir -p build dist
          xcrun safari-web-extension-converter extension --project-location build/safari --app-name VEILUX \
            --bundle-identifier io.github.aymenmarjan.veilux --swift --macos-only --copy-resources \
            --no-open --no-prompt --force 2>&1 | tee dist/safari-converter-report.txt
      - name: Build unsigned
        run: |
          project=$(find build/safari -maxdepth 3 -name '*.xcodeproj' | head -1)
          xcodebuild -list -project "$project"
          xcodebuild -project "$project" -scheme VEILUX -configuration Release -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -25
          (cd build/safari && zip -qr ../../dist/veilux-safari-xcode-project-unsigned.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: safari-experimental
          path: dist/
          retention-days: 30
