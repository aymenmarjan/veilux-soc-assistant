# Runs on every push and pull request: the Firefox add-on lint, the web API
# compatibility check and the extension's Node tests, then the test suite in
# Chromium and in Firefox's engine. See docs/BROWSER_TESTING.md. The backend
# key file's permissions are also checked on Windows, macOS and Linux.
name: Browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

# The checks only read the code.
permissions:
  contents: read

jobs:
  lint:
    name: Add-on lint and API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the checkers
        working-directory: tools/browser-check
        run: npm ci --no-audit --no-fund
      - name: Run the checks
        working-directory: tools/browser-check
        run: npm run check
      - name: Extension module tests in Node
        run: for f in tests/test_*.js; do node "$f"; done

  tests:
    name: Tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: pip install -r requirements-test.txt
      - name: Install the browser
        run: python -m playwright install --with-deps chromium ${{ matrix.engine }}
      - name: Run the tests
        env:
          VEILUX_TEST_ENGINE: ${{ matrix.engine }}
        run: python -m pytest -q tests

  key-file:
    name: Backend key file (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: pip install -r requirements-test.txt
      - name: Check the key file's permissions
        run: python -m pytest -q tests/test_backend_origin.py -k "key_file or link_in_place or no_key_is_written"
