name: Bug report
description: Something in VEILUX does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real logs, IP addresses, host or user names, domains, API keys or tokens.**
        Replace them with synthetic values (192.0.2.10, example.com, synthetic-key) that still show the problem.
        For a security vulnerability, use the repository's Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the popup on ...\n2. Click ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VEILUX version
      description: Settings → Backend → Check backend shows it.
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131, Firefox 140 ESR, ...
  - type: input
    id: siem
    attributes:
      label: Platform template or log source involved, if any
      placeholder: "A platform template, or: an HTML table, page JSON, a JSON API"
